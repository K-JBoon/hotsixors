name: Build & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-deploy.yml'
      - '.gitmodules'
      - 'data/**'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'site/**'
      - 'submodules/**'
      - 'tsconfig.json'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      ptr:
        description: 'Build the PTR site instead of live'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ptr:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: build-deploy-${{ github.ref }}-${{ inputs.ptr && 'ptr' || 'live' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOTS_PTR: ${{ inputs.ptr && '1' || '0' }}
      CASC_KEY_PREFIX: casc-${{ inputs.ptr && 'ptr' || 'live' }}
      SITE_URL: ${{ inputs.ptr && 'https://hots-ptr.epixors.com' || 'https://hots.epixors.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch history for sitemap dates
        run: git fetch --unshallow --filter=blob:none origin

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve the served build
        id: target
        run: |
          set +e
          build=$(npm run -s extract:print-build)
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "No PTR build to deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Look for an earlier deploy
        id: deployed
        if: ${{ env.SKIP != 'true' && github.event_name != 'workflow_dispatch' }}
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: deployed-${{ env.CASC_KEY_PREFIX }}-${{ steps.target.outputs.build }}-${{ github.sha }}
          lookup-only: true

      - name: Skip an unchanged build
        if: ${{ steps.deployed.outputs.cache-hit == 'true' }}
        run: |
          echo "SKIP=true" >> "$GITHUB_ENV"
          echo "Build ${{ steps.target.outputs.build }} is already deployed from this commit." >> "$GITHUB_STEP_SUMMARY"

      - name: Install Zola
        if: ${{ env.SKIP != 'true' }}
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.23.4/zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Cache HeroesDataParser
        if: ${{ env.SKIP != 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            .hdp
            !.hdp/casc
          key: hdp-${{ runner.os }}-${{ hashFiles('scripts/extract-gamedata.ts') }}

      - name: Restore CASC cache
        id: casc
        if: ${{ env.SKIP != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: .hdp/casc
          key: ${{ env.CASC_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: ${{ env.CASC_KEY_PREFIX }}-

      - name: Extract game data
        id: extract
        if: ${{ env.SKIP != 'true' }}
        run: |
          set +e
          npm run extract
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "No PTR build to deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          version=$(node -p "JSON.parse(require('fs').readFileSync('.gamedata/mods/hdp.info','utf-8')).Version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Save CASC cache
        if: ${{ success() && env.SKIP != 'true' && steps.casc.outputs.cache-matched-key != format('{0}-{1}', env.CASC_KEY_PREFIX, steps.extract.outputs.version) }}
        uses: actions/cache/save@v4
        with:
          path: .hdp/casc
          key: ${{ env.CASC_KEY_PREFIX }}-${{ steps.extract.outputs.version }}

      - name: Generate content & build
        if: ${{ env.SKIP != 'true' }}
        run: npm run build
        env:
          ZOLA_BASE_URL: ${{ inputs.ptr && 'https://hots-ptr.epixors.com' || '' }}

      - name: Commit new ability-link catalog
        if: ${{ github.event_name != 'pull_request' && env.SKIP != 'true' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/replay-abillinks
          if git diff --cached --quiet; then
            echo "No new ability-link catalog."
            exit 0
          fi
          git commit -m "chore: add ability-link catalog for new build"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" &&
               git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

      - name: Validate Cloudflare secrets
        if: ${{ env.SKIP != 'true' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }

      - name: Read the served game version
        id: served
        if: ${{ env.SKIP != 'true' }}
        run: |
          version=$(curl -fsS "$SITE_URL/build-info.json?run=$GITHUB_RUN_ID" | jq -r '.game_version // empty' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: ${{ env.SKIP != 'true' }}
        run: |
          npx --yes wrangler@4 pages deploy site/public \
            --project-name="${{ inputs.ptr && 'hotsixors-ptr' || 'hotsixors' }}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}"

      - name: Announce a new game version
        if: ${{ env.SKIP != 'true' && steps.served.outputs.version != '' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets[inputs.ptr && 'DISCORD_WEBHOOK_PTR' || 'DISCORD_WEBHOOK_LIVE'] }}
          SERVED_VERSION: ${{ steps.served.outputs.version }}
          REALM: ${{ inputs.ptr && 'PTR' || 'Live' }}
          GAME_VERSION: ${{ steps.extract.outputs.version }}
        run: |
          version=$(jq -r .game_version site/data/build-info.json)
          if [ "$version" = "$SERVED_VERSION" ]; then
            exit 0
          fi
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook for $REALM."
            exit 0
          fi
          jq -n --arg content "New $REALM version $GAME_VERSION is up on $SITE_URL" \
            '{content: $content, allowed_mentions: {parse: []}, flags: 4}' \
            | curl -fsS -H "Content-Type: application/json" --data @- "$DISCORD_WEBHOOK"

      - name: Record the deploy
        if: ${{ env.SKIP != 'true' }}
        run: |
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git rev-parse HEAD > .deployed

      - name: Save the deploy marker
        if: ${{ env.SKIP != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .deployed
          key: deployed-${{ env.CASC_KEY_PREFIX }}-${{ steps.target.outputs.build }}-${{ env.DEPLOY_SHA }}
