name: Build & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-deploy.yml'
      - '.gitmodules'
      - 'data/**'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'site/**'
      - 'submodules/**'
      - 'tsconfig.json'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      ptr:
        description: 'Build the PTR site instead of live'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ptr:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: build-deploy-${{ github.ref }}-${{ inputs.ptr && 'ptr' || 'live' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOTS_PTR: ${{ inputs.ptr && '1' || '0' }}
      CASC_KEY_PREFIX: casc-${{ inputs.ptr && 'ptr' || 'live' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.23.4/zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Cache HeroesDataParser
        uses: actions/cache@v4
        with:
          path: |
            .hdp
            !.hdp/casc
          key: hdp-${{ runner.os }}-${{ hashFiles('scripts/extract-gamedata.ts') }}

      # The CASC cache holds the archives the extract downloads. A build shares
      # most of them with the one before it, so restore the newest entry.
      - name: Restore CASC cache
        id: casc
        uses: actions/cache/restore@v4
        with:
          path: .hdp/casc
          key: ${{ env.CASC_KEY_PREFIX }}-${{ github.run_id }}
          restore-keys: ${{ env.CASC_KEY_PREFIX }}-

      # Exit code 75 means the PTR product has no build of its own, or its
      # build went away mid-run. Stop the job without failing it.
      - name: Extract game data
        id: extract
        run: |
          set +e
          npm run extract
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No PTR build to deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$code" -eq 0 ] || exit "$code"
          version=$(node -p "JSON.parse(require('fs').readFileSync('.gamedata/mods/hdp.info','utf-8')).Version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Save CASC cache
        if: ${{ success() && steps.extract.outputs.skip != 'true' && steps.casc.outputs.cache-matched-key != format('{0}-{1}', env.CASC_KEY_PREFIX, steps.extract.outputs.version) }}
        uses: actions/cache/save@v4
        with:
          path: .hdp/casc
          key: ${{ env.CASC_KEY_PREFIX }}-${{ steps.extract.outputs.version }}

      - name: Generate content & build
        if: ${{ steps.extract.outputs.skip != 'true' }}
        run: npm run build
        env:
          ZOLA_BASE_URL: ${{ inputs.ptr && 'https://hots-ptr.epixors.com' || '' }}

      # The catalog of a build does not change. Keep it, for live and PTR
      # replays of a build that is no longer current.
      - name: Commit new ability-link catalog
        if: ${{ github.event_name != 'pull_request' && steps.extract.outputs.skip != 'true' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/replay-abillinks
          if git diff --cached --quiet; then
            echo "No new ability-link catalog."
            exit 0
          fi
          git commit -m "chore: add ability-link catalog for new build"
          # The live and PTR workflows share this store and can run at once.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" &&
               git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((RANDOM % 10 + 5))
          done
          exit 1

      - name: Validate Cloudflare secrets
        if: ${{ steps.extract.outputs.skip != 'true' }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }

      - name: Deploy to Cloudflare Pages
        if: ${{ steps.extract.outputs.skip != 'true' }}
        run: |
          npx --yes wrangler@4 pages deploy site/public \
            --project-name="${{ inputs.ptr && 'hotsixors-ptr' || 'hotsixors' }}" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}"
