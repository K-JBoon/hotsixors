name: Build & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-deploy.yml'
      - '.gitmodules'
      - 'data/**'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'site/**'
      - 'submodules/*'
      - 'submodules/**'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Zola
        run: |
          curl -sL https://github.com/getzola/zola/releases/download/v0.19.2/zola-v0.19.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Generate content & build
        run: npm run build

      - name: Validate Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is required"; exit 1; }

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes wrangler@4 pages deploy site/public \
            --project-name=hotsixors \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}"
