name: PTR Build & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-deploy.yml'
      - '.github/workflows/ptr-deploy.yml'
      - '.gitmodules'
      - 'data/**'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/**'
      - 'site/**'
      - 'submodules/**'
      - 'tsconfig.json'
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ptr:
    uses: ./.github/workflows/build-deploy.yml
    with:
      ptr: true
    secrets: inherit
