{% extends "base.html" %}

{% block title %}Battlegrounds — {{ config.title }}{% endblock title %}

{% block content %}
<div class="battlegrounds-list" data-select-search data-select-search-noun="battlegrounds">
  <div class="battlegrounds-list__header">
    <h1 class="page-title">Battlegrounds</h1>
    <div class="select-search" role="search" aria-label="Battlegrounds">
      <label class="visually-hidden" for="battleground-filter">Filter battlegrounds by name</label>
      <input class="select-search__input"
             id="battleground-filter"
             type="search"
             placeholder="Filter battlegrounds"
             autocomplete="off"
             spellcheck="false"
             data-select-search-input>
      <span class="select-search__count" data-select-search-count></span>
    </div>
    <span class="select-search-status" aria-live="polite" data-select-search-status></span>
  </div>
  <div class="battlegrounds-grid">
    {% for page in section.pages | sort(attribute="title") %}
    <a class="battleground-card"
       href="{{ page.permalink }}"
       data-select-search-card
       data-select-search-id="{{ page.slug }}"
       data-select-search-text="{{ page.title }}">
      {% if page.extra.loading_screen %}
      {{<images.optimized path={'images/battlegrounds/' ~ page.extra.battleground_slug ~ '.png'} class="battleground-card__image" alt="" width={480} height={270} op="fill" display_width={480} display_height={270} loading="lazy" />}}
      {% endif %}
      <span class="battleground-card__name">{{ page.title }}</span>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock content %}
