base_url = "https://hots.epixors.com"
title = "HotSixors"
description = "Heroes of the Storm hero data, talent builds, battlegrounds, a replay viewer, mock draft tool, datamining tools and more!"
compile_sass = false
generate_feeds = false
# The site ships its own index (static/site-search.json); Zola's elasticlunr
# bundle is never fetched.
build_search_index = false
minify_html = true
# Generated pages carry game strings that can contain Tera-looking braces; only
# hand-written guides are templated.
skip_content_templating = ["heroes/**", "gamedata/**", "battlegrounds/**"]

[extra]
role_colors = { Warrior = "#1a6bbf", Assassin = "#bf1a1a", Support = "#1abf6b", Specialist = "#8b1abf", Multiclass = "#bf8b1a" }
# The 3D battleground geometry is served from R2, not from the site: it is
# hundreds of megabytes and tens of thousands of files, which a static host
# will not take. Empty means "same origin", which is what a local build wants.
nexus_assets = "https://nexus.epixors.com"
